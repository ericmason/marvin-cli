[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marvin-cli"
version = "0.1.0"
description = "A simple command-line interface for Amazing Marvin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Eric Mason" }]
keywords = ["amazing-marvin", "marvin", "todo", "tasks", "cli", "productivity"]
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/ericmason/marvin-cli"
Repository = "https://github.com/ericmason/marvin-cli"
Issues = "https://github.com/ericmason/marvin-cli/issues"

[project.scripts]
marvin = "marvin:main"

[tool.setuptools]
py-modules = ["marvin"]
